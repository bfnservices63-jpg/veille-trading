name: Surveillance news continue

on:
  schedule:
    # Toutes les 3h, en continu jour et nuit (crypto/forex bougent 24/7).
    - cron: "0 */3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  news-watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: Vérifier les news et alerter si besoin
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/run_news_watch.py

      - name: Committer l'état de surveillance
        run: |
          git config user.name "trading-bot"
          git config user.email "trading-bot@users.noreply.github.com"
          git add history/news_watch_state.json
          if ! git diff --cached --quiet; then
            git commit -m "Surveillance news $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
